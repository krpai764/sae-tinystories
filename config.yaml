# Single source of truth for every setting. Scripts read this via src/config.py.
seed: 1234

paths:
  data_dir: data            # token ids, activation memmaps (git-ignored)
  checkpoint_dir: checkpoints
  results_dir: results
  figures_dir: figures
  hf_cache_dir: hf_cache    # keeps downloaded models/datasets inside the project

device:
  preferred: mps            # auto | cpu | mps ; mps won the Stage 0 matmul test narrowly, re-check in Stage 1 on the real model
  speed_test_matrix: 2048   # size of matmul used in scripts/device_test.py
  speed_test_repeats: 20

model:
  name: roneneldan/TinyStories-8M  # 8 blocks, width 256, 19.7M params (chosen in Stage 1)
  layer: 3                  # residual stream after block 3 (0-indexed) = midpoint of 8 blocks
  max_seq_len: 256

data:
  dataset: roneneldan/TinyStories
  train_split: train
  heldout_split: validation # never used to train the SAE
  num_train_tokens: 2500000 # Stage 2 target (brief: 2-5M); 2.5M fp32 x 256 = ~2.6 GB, keeps total under the 3 GB cap
  num_heldout_tokens: 200000
  parquet_train_file: data/train-00000-of-00004-2d5a1467fff1081b.parquet        # one shard (249 MB) is plenty
  parquet_valid_file: data/validation-00000-of-00001-869c898b519ad725.parquet
  collect_batch_size: 32    # stories per forward pass during collection
  collect_checkpoint_every: 50  # batches between progress saves (resume support)
  tolerance_atol: 1.0e-3    # saved-vs-recomputed row check (mps batched vs cpu single)

sae:
  expansion: 8              # dictionary size = 8 x model width
  lr: 3.0e-4
  batch_size: 4096
  l1_coeffs: [0.5, 1, 2, 4] # from the Stage 3 pilot; 2x spacing (3x would put 2 of 4 runs outside the usable 0.5-4 range)
  epochs: 20
  resample_after_epochs: [2, 4, 6, 8]  # Bricken's 4 resampling points, scaled to the first 40% of training
  resample_pool: 200000     # inputs scored when choosing resampling directions (Bricken: 819,200)
  l0_plateau_rel_change: 0.02  # 'levelled off' = L0 changed < 2% per epoch over the last 3 epochs
  dead_window_batches: 5000
  enc_init_scale: 0.25      # W_e init = 0.25 * W_d^T (= 2d/m); 1.0 gave a 4x-too-large initial reconstruction
  dead_fraction_resample: 0.1

sae_pilot:                  # Stage 3 pilot: wide lambda grid, short, no resampling
  lambdas: [0.3, 1, 3, 10, 30]
  epochs: 5

interpret:                  # Stage 5
  chosen_lambda: 1          # carried forward from Stage 4 (user confirmed)
  n_features: 200
  batch_size: 50            # labels delivered in batches of 50
  top_k: 20
  n_random: 5               # uniformly random firing examples per feature
  context_before: 14
  context_after: 4
  n_promoted_tokens: 10

random_control:             # Stage 5 sanity check (shuffled-weights model, Bricken et al.)
  shuffle_seed: 4321
  num_tokens: 400000        # stored fp16 (0.2 GB) to stay within the ~3 GB disk cap
  eval_tokens: 40000
  epochs: 120               # ~11.6k steps, close to the real SAE's 12.1k
  resample_after_epochs: [12, 24, 36, 48]

steering:                   # Stage 6
  # chosen from features strictly clear in Stage 5 AND 5/5 blind; picked for content-visible labels
  clear_features: [144, 597, 1211, 2014, 215, 1905]
  unclear_features: [1693, 978]   # not clear in Stage 5 ('time' 1/5 blind, 'sunshine' 2/5)
  multipliers: [0.5, 1, 2, 5, 10] # x typical strong firing (mean of top-20 acts); brief asks 2,5,10; smoke test showed 2x already breaks text, so 0.5 and 1 added
  max_new_tokens: 50
  prompts:
    - "Once upon a time, there was a little girl named Lily."
    - "Tom and his dog went to the park. They saw"

steering_extension:         # Stage 6 extension: context/theme features, gentler strengths
  # rule: every Stage 5 label naming a topic/domain (not a syntactic slot or a single next token),
  # regardless of clear verdict or blind score, excluding features already steered
  clear_features: [1137]          # ' rain' in 'started to rain' (clear, 3/5 blind)
  unclear_features: [916, 1463, 687, 1970, 715]  # bees/honey, cold weather, safety warnings, chores, music
  multipliers: [0.5, 0.75, 1, 1.25, 1.5, 2]
  # theme words, fixed BEFORE looking at the steered text; counted as whole lower-case words
  theme_words:
    1137: [rain, raining, rained, rainy, wet, umbrella, cloud, clouds, storm, puddle, puddles]
    916: [bee, bees, honey, hive, hives, buzz, buzzing, flower, flowers]
    1463: [cold, snow, winter, freezing, ice, icy, coat, shiver, shivering, warm]
    687: [dangerous, danger, careful, safe, hurt, warned, warning, stay, close]
    1970: [clean, cleaning, dishes, laundry, sweep, chores, wash, washing, weeds, tidy, mess]
    715: [music, song, songs, sing, singing, drum, drums, guitar, piano, instrument, violin, play, played]
  max_new_tokens: 50
  prompts:
    - "Once upon a time, there was a little girl named Lily."
    - "Tom and his dog went to the park. They saw"

trace:                      # Stage 7: pronoun after a named character
  # names are single tokens with a leading space and common in the training tokens; split alternates by frequency
  girl_names_rank: [Lily, Mia, Sara, Sarah, Sally]
  girl_names_heldout: [Anna, Lucy, Sue, Jane, Amy]
  boy_names_rank: [Tim, Tom, Bob, John, Tommy]
  boy_names_heldout: [Ben, Jack, Joe, Billy, Jim]
  frames:                   # {N} = name, {G} = girl/boy; case = pronoun capitalised (She/He) or lower (she/he)
    - {id: went,    kind: name_only, case: cap,   text: "One day, {N} went to the park."}
    - {id: found,   kind: name_only, case: cap,   text: "Once upon a time, {N} found a big red ball."}
    - {id: because, kind: name_only, case: lower, text: "Yesterday, {N} was very happy because"}
    - {id: but,     kind: name_only, case: lower, text: "One day, {N} wanted to play outside, but"}
    - {id: named,   kind: noun_name, case: cap,   text: "Once upon a time, there was a little {G} named {N}."}
    - {id: who,     kind: noun_name, case: lower, text: "There was a kind {G} named {N} who was sad because"}
  top_k: 10
  n_random_sets: 100
  pass_fraction: 0.95       # top-10 must beat this share of random sets on held-out names
  flip_top_k: [5, 10]       # per-gender features used in the flip test
  flip_strengths: [0.5, 1, 1.5, 2]  # x the feature's mean activation on the other gender's prompts (same frame and position)
  flip_random_draws: 20
  # post-hoc (added after seeing that shared context features dominate the top-10): gender-selective features
  selective_ratio: 5        # mean peak activation on one gender's ranking-name prompts >= 5x the other's
  selective_k: 5

steering_v2:                # Review rerun 1a. Everything in this block was fixed and committed BEFORE the run.
  unit: median_nonzero_firing   # strength k means k x the feature's median activation over all its training firings (results/stage5/features.json median_act)
  multipliers: [2, 3, 5, 7, 10] # the brief's 2, 5, 10 plus two values in between
  n_random_directions: 3        # per feature, same length as the feature vector at each strength
  max_new_tokens: 50
  groups:
    main_clear: [144, 597, 1211, 2014, 215, 1905]   # the original six (hand-picked from the 20 strict-clear & 5/5 features)
    main_unclear: [1693, 978]
    topic: [1137, 916, 1463, 687, 1970, 715]        # hand-picked topic labels (NOT every topic label; e.g. 1470 was left out)
  prompts:
    - "Once upon a time, there was a little girl named Lily."
    - "Tom and his dog went to the park. They saw"
    - "One day, a small rabbit found a shiny red ball."
    - "Ben woke up early and looked out of the window."
    - "There was a big tree near the house. Under the tree,"
    - "Mia and her brother wanted to make a cake."
    - "The little bird could not find its way home."
    - "Sam had a new toy car. He took it"
    - "It was a quiet day in the village."
    - "Anna opened the door and"
  # Word lists written from the LABEL TEXT ONLY (words quoted in the label, their plain inflections, and members of a
  # category the label names). Not taken from decoder promoted tokens or from any steered text. Counted as whole lower-case words.
  label_words:
    144: [little, boy, girl]                       # ' little' in 'there was a little boy/girl'
    597: [big, saw]                                # ' big' in 'saw a big ...'
    1211: [mom, mommy, mum, mother, dad]           # ' mom' as companion ('with her mom', 'her mom and dad')
    2014: [fox, cat, dog, bird, rabbit, bear, mouse, squirrel, frog, duck, pig, cow, horse, lion, monkey, fish, bunny, kitten, puppy, elephant, owl, turtle]  # animal noun as protagonist
    215: [so, sad, upset, scared, angry, mad, worried]   # ' was' followed by 'so' + emotion after a mishap
    1905: [happily, ever, after, end, lesson, learned, moral]  # '.' ending a story's closing/moral sentence
    1693: [time, home]                             # ' time' in 'it was time to go home'
    978: [sunshine, sun, sunny]                    # ' sunshine' in 'in the sunshine'
    1137: [rain, raining, rained, rainy, raindrops]
    916: [bee, bees, hive, hives, honey, beehive]
    1463: [cold, colder, chilly, freezing, snow, snowy, winter, icy]
    687: [dangerous, danger, careful, safe, warned, warning]
    1970: [dishes, dish, laundry, weeds, chores, chore, clothes, floor]
    715: [music, instrument, piano, guitar, drum, drums, violin, flute, song, songs]
  success_rule:
    fluent: "a (feature, strength) cell is fluent if the median over prompts of the steered text's perplexity under the unsteered model is <= 2 x the 95th percentile of the perplexity of all unsteered samples in this run"
    on_label: "a cell is on-label if the steered text has more label words than the mean of the 3 random-direction texts on at least 9 of the 10 prompts (ties count against; one-sided sign test p = 0.011), and its mean label-word count also exceeds the unsteered mean"
    feature_succeeds: "a feature steers if at least one of the 5 strengths is both fluent and on-label (5 chances per feature, so a false pass has probability up to about 0.05 per feature)"
    claim: "'steering reliably moves text toward the label' is supported for a group only if at least 5 of its 6 features steer; 2 to 4 = 'sometimes'; 0 or 1 = not supported. Counts are reported whatever they are."

generation:
  seed: 1234                # same seed + prompt -> same story
  prompts:
    - "Once upon a time, there was a little girl named Lily."
    - "Tom and his dog went to the park. They saw"
    - "One day, a small rabbit found a shiny red ball."
  max_new_tokens: 80
  temperature: 0.8

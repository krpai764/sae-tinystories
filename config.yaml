# Single source of truth for every setting. Scripts read this via src/config.py.
seed: 1234

paths:
  data_dir: data            # token ids, activation memmaps (git-ignored)
  checkpoint_dir: checkpoints
  results_dir: results
  figures_dir: figures
  hf_cache_dir: hf_cache    # keeps downloaded models/datasets inside the project

device:
  preferred: mps            # auto | cpu | mps ; mps won the Stage 0 matmul test narrowly, re-check in Stage 1 on the real model
  speed_test_matrix: 2048   # size of matmul used in scripts/device_test.py
  speed_test_repeats: 20

model:
  name: roneneldan/TinyStories-8M  # 8 blocks, width 256, 19.7M params (chosen in Stage 1)
  layer: 3                  # residual stream after block 3 (0-indexed) = midpoint of 8 blocks
  max_seq_len: 256

data:
  dataset: roneneldan/TinyStories
  train_split: train
  heldout_split: validation # never used to train the SAE
  num_train_tokens: 2500000 # Stage 2 target (brief: 2-5M); 2.5M fp32 x 256 = ~2.6 GB, keeps total under the 3 GB cap
  num_heldout_tokens: 200000
  parquet_train_file: data/train-00000-of-00004-2d5a1467fff1081b.parquet        # one shard (249 MB) is plenty
  parquet_valid_file: data/validation-00000-of-00001-869c898b519ad725.parquet
  collect_batch_size: 32    # stories per forward pass during collection
  collect_checkpoint_every: 50  # batches between progress saves (resume support)
  tolerance_atol: 1.0e-3    # saved-vs-recomputed row check (mps batched vs cpu single)

sae:
  expansion: 8              # dictionary size = 8 x model width
  lr: 3.0e-4
  batch_size: 4096
  l1_coeffs: [0.5, 1, 2, 4] # from the Stage 3 pilot; 2x spacing (3x would put 2 of 4 runs outside the usable 0.5-4 range)
  epochs: 20
  resample_after_epochs: [2, 4, 6, 8]  # Bricken's 4 resampling points, scaled to the first 40% of training
  resample_pool: 200000     # inputs scored when choosing resampling directions (Bricken: 819,200)
  l0_plateau_rel_change: 0.02  # 'levelled off' = L0 changed < 2% per epoch over the last 3 epochs
  dead_window_batches: 5000
  enc_init_scale: 0.25      # W_e init = 0.25 * W_d^T (= 2d/m); 1.0 gave a 4x-too-large initial reconstruction
  dead_fraction_resample: 0.1

sae_pilot:                  # Stage 3 pilot: wide lambda grid, short, no resampling
  lambdas: [0.3, 1, 3, 10, 30]
  epochs: 5

interpret:                  # Stage 5
  chosen_lambda: 1          # carried forward from Stage 4 (user confirmed)
  n_features: 200
  batch_size: 50            # labels delivered in batches of 50
  top_k: 20
  n_random: 5               # uniformly random firing examples per feature
  context_before: 14
  context_after: 4
  n_promoted_tokens: 10

random_control:             # Stage 5 sanity check (shuffled-weights model, Bricken et al.)
  shuffle_seed: 4321
  num_tokens: 400000        # stored fp16 (0.2 GB) to stay within the ~3 GB disk cap
  eval_tokens: 40000
  epochs: 120               # ~11.6k steps, close to the real SAE's 12.1k
  resample_after_epochs: [12, 24, 36, 48]

steering:                   # Stage 6
  # chosen from features strictly clear in Stage 5 AND 5/5 blind; picked for content-visible labels
  clear_features: [144, 597, 1211, 2014, 215, 1905]
  unclear_features: [1693, 978]   # not clear in Stage 5 ('time' 1/5 blind, 'sunshine' 2/5)
  multipliers: [0.5, 1, 2, 5, 10] # x typical strong firing (mean of top-20 acts); brief asks 2,5,10; smoke test showed 2x already breaks text, so 0.5 and 1 added
  max_new_tokens: 50
  prompts:
    - "Once upon a time, there was a little girl named Lily."
    - "Tom and his dog went to the park. They saw"

generation:
  seed: 1234                # same seed + prompt -> same story
  prompts:
    - "Once upon a time, there was a little girl named Lily."
    - "Tom and his dog went to the park. They saw"
    - "One day, a small rabbit found a shiny red ball."
  max_new_tokens: 80
  temperature: 0.8
